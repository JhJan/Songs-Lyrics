        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .lyric-line { transition: opacity 0.4s ease-out, transform 0.4s ease-out, text-shadow 0.4s ease; transform-origin: left center; scroll-margin-top: 200px; }

        .lyric-line.inactive { opacity: 0.25; transform: scale(1); }
        
        .toggle-btn.active { background-color: rgba(255, 255, 255, 0.2); color: white; border-color: transparent; }
        .toggle-btn { background-color: transparent; color: rgba(255, 255, 255, 0.5); border: 1px solid rgba(255, 255, 255, 0.3); }

        .icon-solid { fill: currentColor; stroke: currentColor; }

        let showPron = true; let showEsp = true;
        const container = document.getElementById('lyrics-container');
        const togglePronBtn = document.getElementById('toggle-pron');
        const toggleEspBtn = document.getElementById('toggle-esp');
        
        function renderLyrics() {
            if(!lyricsData || lyricsData.length === 0) {
                container.innerHTML += `<div class="text-white/40 italic text-center mt-20">No se proporcionaron letras.</div>`;
                return;
            }
            
            lyricsData.forEach((lyric, index) => {
                const block = document.createElement('div');
                block.className = 'lyric-line inactive cursor-pointer py-2';
                block.dataset.index = index;
                
                let htmlContent = '';
                if(lyric.en) {
                    htmlContent += `<div class="text-[24px] md:text-[28px] font-bold text-white tracking-tight leading-tight mb-1.5 layer-en">${lyric.en}</div>`;
                }
                if(lyric.pron) {
                    htmlContent += `<div class="text-[14px] md:text-[15px] italic text-white/50 layer-pron mb-1 transition-all duration-300 ${showPron ? 'block' : 'hidden'}">${lyric.pron}</div>`;
                }
                if(lyric.es) {
                    htmlContent += `<div class="text-[15px] md:text-[16px] text-white/70 layer-es transition-all duration-300 ${showEsp ? 'block' : 'hidden'}">${lyric.es}</div>`;
                }
                
                block.innerHTML = htmlContent;
                block.addEventListener('click', () => { 
                    block.scrollIntoView({ behavior: 'smooth', block: 'center' }); 
                });
                container.appendChild(block);
            });
        }
        
        function updateLayersVisibility() {
            document.querySelectorAll('.layer-pron').forEach(el => el.style.display = showPron ? 'block' : 'none');
            document.querySelectorAll('.layer-es').forEach(el => el.style.display = showEsp ? 'block' : 'none');
        }
        
        togglePronBtn.addEventListener('click', () => { showPron = !showPron; togglePronBtn.classList.toggle('active'); updateLayersVisibility(); });
        toggleEspBtn.addEventListener('click', () => { showEsp = !showEsp; toggleEspBtn.classList.toggle('active'); updateLayersVisibility(); });
        
        function initManualScrollSync() {
            // Mejora UX: Lente de enfoque mucho más estricto (centro de la pantalla)
            const observerOptions = { root: container, rootMargin: '-35% 0px -45% 0px', threshold: 0 };
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        document.querySelectorAll('.lyric-line').forEach(el => { el.classList.remove('active'); el.classList.add('inactive'); });
                        entry.target.classList.remove('inactive'); entry.target.classList.add('active');
                    }
                });
            }, observerOptions);
            document.querySelectorAll('.lyric-line').forEach(line => observer.observe(line));
        }
        
        renderLyrics();
        // Timeout ligero para asegurar que el DOM esté listo antes de observar
        setTimeout(initManualScrollSync, 100);
